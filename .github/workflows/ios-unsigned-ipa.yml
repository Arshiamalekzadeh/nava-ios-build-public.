name: NAVA iPhone IPA (unsigned)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "NAVA/**"
      - "NAVAWidgetExtension/**"
      - "Shared/**"
      - "project.yml"
      - ".github/workflows/ios-unsigned-ipa.yml"
  push:
    branches: [main]
    paths:
      - "NAVA/**"
      - "NAVAWidgetExtension/**"
      - "Shared/**"
      - "project.yml"
      - ".github/workflows/ios-unsigned-ipa.yml"

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Persian commands
        run: |
          swiftc NAVA/Services/NAVACommandParser.swift NAVA/Services/NAVADeviceControlParser.swift Tests/CommandParserTests.swift -o /tmp/nava-command-tests
          /tmp/nava-command-tests
      - name: Verify hands-free turn detection
        run: |
          swiftc NAVA/Services/NAVAVoiceActivityDetector.swift Tests/VoiceActivityDetectorTests.swift -o /tmp/nava-voice-tests
          /tmp/nava-voice-tests
      - name: Verify live speech buffering and automatic turns
        run: |
          swiftc NAVA/Services/NAVAVoiceActivityDetector.swift NAVA/Services/NAVALiveSpeechWindow.swift Tests/LiveSpeechWindowTests.swift -o /tmp/nava-live-tests
          /tmp/nava-live-tests
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          swift tools/generate-icon.swift
          swift tools/generate-soundpack.swift
          bash tools/prepare-persian-tts.sh
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project NAVA.xcodeproj -scheme NAVA
      - name: Build iPhone app (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project NAVA.xcodeproj \
            -scheme NAVA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee iphone-build.log
      - name: Validate and package unsigned IPA
        shell: bash
        run: bash tools/package-iphone-ipa.sh
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: NAVA-unsigned-iPhone-IPA
          path: NAVA-unsigned-iPhone.ipa
          retention-days: 30
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NAVA-iPhone-build-diagnostics
          path: iphone-build.log
          if-no-files-found: ignore
