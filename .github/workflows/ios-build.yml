name: iOS build
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify Persian commands
        run: |
          swiftc NAVA/Services/NAVACommandParser.swift Tests/CommandParserTests.swift -o /tmp/nava-command-tests
          /tmp/nava-command-tests
      - name: Verify hands-free turn detection
        run: |
          swiftc NAVA/Services/NAVAVoiceActivityDetector.swift Tests/VoiceActivityDetectorTests.swift -o /tmp/nava-voice-tests
          /tmp/nava-voice-tests
      - name: Generate metallic app icon
        run: |
          swift tools/generate-icon.swift
          swift tools/generate-soundpack.swift
      - name: Fetch bundled Persian Piper TTS model
        run: bash tools/prepare-persian-tts.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild -project NAVA.xcodeproj -scheme NAVA -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee xcodebuild.log
      - name: Package simulator build
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/NAVA.app NAVA-simulator.zip
      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NAVA-simulator
          path: NAVA-simulator.zip
          if-no-files-found: error
      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NAVA-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
