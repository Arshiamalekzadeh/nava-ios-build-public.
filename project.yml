name: NAVA
packages:
  ArgmaxSpeech:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.0.0
options:
  bundleIdPrefix: com.arshia
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "4.3.0"
    CURRENT_PROJECT_VERSION: "43"
targets:
  NAVA:
    type: application
    platform: iOS
    sources:
      - path: NAVA
      - path: Shared
    info:
      path: NAVA/Info.plist
      properties:
        CFBundleDisplayName: NAVA
        CFBundleShortVersionString: "4.3.0"
        CFBundleVersion: "43"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.arshia.nava.voice
            CFBundleURLSchemes:
              - nava
        NSCalendarsFullAccessUsageDescription: "NAVA adds calendar events when you explicitly request them."
        NSMicrophoneUsageDescription: "NAVA uses the microphone only when you start a voice command."
        NSSpeechRecognitionUsageDescription: "NAVA transcribes voice commands to run local actions."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arshia.nava
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NAVAWidgetExtension
        embed: true
      - package: ArgmaxSpeech
        product: WhisperKit
  NAVAWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NAVAWidgetExtension
      - path: Shared
    info:
      path: NAVAWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: NAVA Live Activity
        CFBundleShortVersionString: "4.3.0"
        CFBundleVersion: "43"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arshia.nava.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
